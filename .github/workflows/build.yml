name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apksigner zipalign unzip zip >/dev/null
          curl -sSL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
          curl -sSL -o APKEditor.jar https://github.com/REAndroid/APKEditor/releases/download/V1.4.3/APKEditor-1.4.3.jar

      - name: Merge splits -> universal APK
        run: |
          mkdir -p in
          cp apks/base.apk apks/split_config.arm64_v8a.apk apks/split_config.xxhdpi.apk in/
          java -Xmx4g -jar APKEditor.jar m -i in -o universal.apk -f
          ls -la universal.apk

      - name: Decompile universal
        run: |
          java -Xmx6g -jar apktool.jar d -f -q -o dec universal.apk || java -Xmx6g -jar apktool.jar d -f -o dec universal.apk
          grep -n "isLinked()Z" dec/smali/com/google/android/vending/licensing/LinkApp.smali | head
          grep -n "ۦۤۢ(Z)V" dec/smali_classes3/idm/internet/download/manager/MainActivity.smali | head

      - name: Apply license patches
        run: python3 patch.py dec

      - name: Rebuild
        run: |
          java -Xmx6g -jar apktool.jar b dec -o patched-unsigned.apk
          ls -la patched-unsigned.apk

      - name: Keystore
        run: |
          keytool -genkeypair -noprompt -keystore key.jks -storepass 1dm12345 -keypass 1dm12345 \
            -alias 1dm -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=1DM Plus Mod, O=local, C=ID" 2>&1 | tail -3

      - name: Zipalign + sign
        run: |
          mkdir -p out
          zipalign -p -f 4 patched-unsigned.apk aligned.apk
          apksigner sign --ks key.jks --ks-pass pass:1dm12345 --key-pass pass:1dm12345 \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out out/1DM_Plus_18.2_unlocked.apk aligned.apk
          apksigner verify --print-certs --verbose out/1DM_Plus_18.2_unlocked.apk | head -20
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: 1dm-unlocked
          path: out/1DM_Plus_18.2_unlocked.apk
          retention-days: 14

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v18.2-unlocked-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" out/1DM_Plus_18.2_unlocked.apk \
            --title "1DM+ 18.2 (license-link bypass)" \
            --notes "Merged universal APK, Play link/license check bypassed, debug-signed." \
            --repo "$GITHUB_REPOSITORY"
