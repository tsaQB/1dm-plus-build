name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apksigner zipalign unzip zip >/dev/null
          curl -sSL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
          curl -sSL -o APKEditor.jar https://github.com/REAndroid/APKEditor/releases/download/V1.4.3/APKEditor-1.4.3.jar
          curl -sSL -o uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

      - name: Decompile base.apk
        run: |
          java -Xmx4g -jar apktool.jar d -f -q -o dec apks/base.apk || java -Xmx4g -jar apktool.jar d -f -o dec apks/base.apk
          ls dec | head

      - name: DUMP AppLinker
        run: |
          echo "########## AppLinker.smali"
          sed -n '1,400p' dec/smali/com/google/android/vending/licensing/AppLinker.smali

      - name: DUMP LinkApp + PreferenceLinker + AppTypee
        run: |
          for f in LinkApp PreferenceLinker AppTypee Linker AppLinkerCallback; do
            echo "########## $f.smali"
            sed -n '1,260p' dec/smali/com/google/android/vending/licensing/$f.smali
          done

      - name: DUMP caller a.smali
        run: |
          echo "### size:"; wc -l dec/smali_classes3/idm/internet/download/manager/a.smali
          sed -n '1,320p' dec/smali_classes3/idm/internet/download/manager/a.smali

      - name: DUMP caller UZ.smali region
        run: |
          echo "### size:"; wc -l dec/smali/i/UZ.smali
          sed -n '5400,5560p' dec/smali/i/UZ.smali

      - name: DUMP MainActivity license refs
        run: |
          grep -n -B6 -A12 "vending/licensing" dec/smali_classes3/idm/internet/download/manager/MainActivity.smali | head -120
          echo "----- a\$b -----"
          grep -n -B6 -A12 "vending/licensing" 'dec/smali_classes3/idm/internet/download/manager/a$b.smali' | head -80
